# Upgrade overlay — one-shot database upgrade service.
#
# Usage:
#   # Preview changes (dry-run):
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --dry-run
#
#   # Apply upgrade:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade
#
#   # Check status:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.upgrade.yml run --rm upgrade --status
#
# The upgrade service runs mantomanagent upgrade and exits. Use --rm to auto-remove the container.

services:
  upgrade:
    image: ghcr.io/nextlevelbuilder/goclaw:latest
    build:
      context: ${MANTOMANAGENT_DIR:-.}
      dockerfile: Dockerfile
      args:
        ENABLE_OTEL: "false"
    env_file:
      - path: .env
        required: false
    environment:
      - MANTOMANAGENT_POSTGRES_DSN=postgres://${POSTGRES_USER:-mantomanagent}:${POSTGRES_PASSWORD:-mantomanagent}@postgres:5432/${POSTGRES_DB:-mantomanagent}?sslmode=disable
      - MANTOMANAGENT_CONFIG=/app/data/config.json
      - MANTOMANAGENT_MIGRATIONS_DIR=/app/migrations
      - MANTOMANAGENT_ENCRYPTION_KEY=${MANTOMANAGENT_ENCRYPTION_KEY:-}
    volumes:
      - mantomanagent-data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/mantomanagent"]
    command: ["upgrade"]
    restart: "no"
