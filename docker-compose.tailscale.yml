# Tailscale overlay — rebuilds with tsnet support for secure remote access.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.postgres.yml -f docker-compose.tailscale.yml up
#
# Required:
#   MANTOMANAGENT_TSNET_AUTH_KEY — Tailscale auth key (from https://login.tailscale.com/admin/settings/keys)
#
# Optional:
#   MANTOMANAGENT_TSNET_HOSTNAME — Tailscale device name (default: mantomanagent-gateway)

services:
  mantomanagent:
    build:
      args:
        ENABLE_TSNET: "true"
    environment:
      - MANTOMANAGENT_TSNET_HOSTNAME=${MANTOMANAGENT_TSNET_HOSTNAME:-mantomanagent-gateway}
      - MANTOMANAGENT_TSNET_AUTH_KEY=${MANTOMANAGENT_TSNET_AUTH_KEY}
    volumes:
      - tsnet-state:/app/tsnet-state

volumes:
  tsnet-state:
