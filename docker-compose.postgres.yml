# PostgreSQL overlay — pgvector for multi-tenant storage.
#
# Usage (web dashboard built-in by default):
#   make up
#   # or: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up -d --build
#
# Required env vars (set in .env or shell):
#   MANTOMANAGENT_OPENROUTER_API_KEY (or another provider key)
#   POSTGRES_PASSWORD (defaults to "mantomanagent" for dev)
#
# If host port 5432 is already in use, set POSTGRES_PORT (e.g. 5433) in .env.
# The mantomanagent container still connects via postgres:5432 on the Docker network.

services:
  postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mantomanagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mantomanagent}
      POSTGRES_DB: ${POSTGRES_DB:-mantomanagent}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mantomanagent} -d ${POSTGRES_DB:-mantomanagent}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  mantomanagent:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - MANTOMANAGENT_POSTGRES_DSN=postgres://${POSTGRES_USER:-mantomanagent}:${POSTGRES_PASSWORD:-mantomanagent}@postgres:5432/${POSTGRES_DB:-mantomanagent}?sslmode=disable
    volumes:
      - mantomanagent-skills:/app/skills
      - mantomanagent-workspace:/app/.mantomanagent

volumes:
  postgres-data:
  mantomanagent-skills:
